[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --verbose --tb=short --strict-markers --cov=sheetcuts --cov-report=html --cov-report=term
markers =
    unit: Unit tests (fast, no dependencies)
    integration: Integration tests
    slow: Slow tests
    performance: Performance tests
